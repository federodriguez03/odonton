<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Odonton</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        pre {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .status-ok { color: #28a745; }
        .status-error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>🧪 Test del Sistema Odonton</h1>
        <hr>
        
        <div id="results"></div>
        
        <button class="btn btn-primary mt-3" onclick="runTests()">Ejecutar Tests</button>
        <button class="btn btn-secondary mt-3" onclick="location.href='/'">Volver a inicio</button>
    </div>

    <script>
        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '';
            
            // Test 1: Verificar API_BASE_URL
            addResult('Test 1: Verificar API_BASE_URL', () => {
                const url = 'http://localhost:3000/api';
                console.log('API_BASE_URL:', url);
                return `✅ API_BASE_URL: ${url}`;
            });

            // Test 2: Conectar al servidor
            await addResultAsync('Test 2: Conectar al servidor', async () => {
                const response = await fetch('http://localhost:3000/api/auth/me', {
                    headers: { 'Authorization': 'Bearer test' }
                });
                return `✅ Servidor respondiendo (Status: ${response.status})`;
            });

            // Test 3: Token en localStorage
            addResult('Test 3: Token en localStorage', () => {
                const token = localStorage.getItem('token');
                if (token) {
                    return `✅ Token encontrado: ${token.substring(0, 20)}...`;
                } else {
                    return `⚠️  No hay token (normal si no estás logueado)`;
                }
            });

            // Test 4: Variables globales
            addResult('Test 4: Variables globales', () => {
                const checks = [];
                checks.push(typeof apiCall === 'function' ? '✅ apiCall' : '❌ apiCall');
                checks.push(typeof showAlert === 'function' ? '✅ showAlert' : '❌ showAlert');
                checks.push(typeof formatDate === 'function' ? '✅ formatDate' : '❌ formatDate');
                return checks.join(' | ');
            });

            // Test 5: Login
            await addResultAsync('Test 5: Probar login', async () => {
                try {
                    const response = await fetch('http://localhost:3000/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: 'admin@odonton.com',
                            password: 'admin123'
                        })
                    });
                    const data = await response.json();
                    if (data.token) {
                        return `✅ Login exitoso - Token: ${data.token.substring(0, 20)}...`;
                    } else {
                        return `❌ Login falló: ${data.error}`;
                    }
                } catch (err) {
                    return `❌ Error: ${err.message}`;
                }
            });

            // Test 6: GET /api/patients
            await addResultAsync('Test 6: Obtener pacientes', async () => {
                try {
                    // Primero hacer login
                    const loginRes = await fetch('http://localhost:3000/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: 'admin@odonton.com',
                            password: 'admin123'
                        })
                    });
                    const loginData = await loginRes.json();
                    
                    if (!loginData.token) {
                        return `❌ No se pudo obtener token`;
                    }

                    // Obtener pacientes
                    const patientsRes = await fetch('http://localhost:3000/api/patients', {
                        headers: { 'Authorization': `Bearer ${loginData.token}` }
                    });
                    const patientsData = await patientsRes.json();
                    
                    if (patientsData.patients) {
                        return `✅ ${patientsData.patients.length} pacientes encontrados`;
                    } else {
                        return `❌ Error: ${patientsData.error}`;
                    }
                } catch (err) {
                    return `❌ Error: ${err.message}`;
                }
            });

            results.innerHTML += '<hr><h3>✅ Todos los tests completados</h3>';
        }

        function addResult(title, testFn) {
            const results = document.getElementById('results');
            try {
                const result = testFn();
                results.innerHTML += `
                    <div class="mb-3">
                        <h5>${title}</h5>
                        <pre class="status-ok">${result}</pre>
                    </div>
                `;
            } catch (err) {
                results.innerHTML += `
                    <div class="mb-3">
                        <h5>${title}</h5>
                        <pre class="status-error">❌ ${err.message}</pre>
                    </div>
                `;
            }
        }

        async function addResultAsync(title, testFn) {
            const results = document.getElementById('results');
            try {
                const result = await testFn();
                results.innerHTML += `
                    <div class="mb-3">
                        <h5>${title}</h5>
                        <pre>${result}</pre>
                    </div>
                `;
            } catch (err) {
                results.innerHTML += `
                    <div class="mb-3">
                        <h5>${title}</h5>
                        <pre class="status-error">❌ ${err.message}</pre>
                    </div>
                `;
            }
        }

        // Ejecutar tests automáticamente
        window.addEventListener('load', runTests);
    </script>
</body>
</html>
